site_name: Latent Sokoban Challenge
site_description: >-
  A public benchmark for latent world models. Solve Sokoban from pixels
  alone, with a live evaluation API and a leaderboard.
site_url: https://sokoban.lulzx.space/docs/
repo_url: https://github.com/Lulzx/latent-sokoban
repo_name: Lulzx/latent-sokoban
edit_uri: edit/main/docs/

# The built site is served under /docs by the FastAPI app, so every internal
# link has to resolve relative to that prefix rather than the domain root.
site_dir: site
use_directory_urls: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  favicon: images/favicon.png
  logo: images/favicon.png
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Methodology: methodology.md
  - Level generation: level-generation.md
  - Scoring: scoring.md
  - Agent protocol: API.md
  - Full rules: RULES.md
  - Play: play.md
  - Code reference:
      - reference/index.md
      - env: reference/env.md
      - levels: reference/levels.md
      - solver: reference/solver.md
      - render: reference/render.md
      - dataset: reference/dataset.md
      - evaluation: reference/evaluation.md
      - agent: reference/agent.md
  - Running the server: operations.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Lulzx/latent-sokoban
