; PufferLib 3.0 config. Format follows the installed pufferlib/config/ocean/
; templates, NOT the 4.0 tree on GitHub -- the two differ.
[base]
package = ocean
env_name = puffer_sokoban
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 1024
; Hidden tier 1: 8x8, one crate, 0.10 wall density, solutions 4-20 moves.
; max_steps mirrors the server's floor of 30.
board_size = 8
n_crates = 1
wall_density = 10
min_len = 4
max_len = 20
max_steps = 30
; Levels are drawn from a pool built once at init. Generation is rejection
; sampling with a BFS inside the loop and does not run at rollout speed, so
; generating per reset would throttle the env to generation rate. Raise for
; more level diversity at the cost of startup time.
pool_size = 4096

[train]
; The leaderboard caps a submitted entry at 2 million environment transitions
; (docs/RULES.md, Fixed Environment-Steps Mode). This default is far above
; that on purpose: development runs are unrestricted and only the declared
; final run has to fit. Set total_timesteps = 2_000_000 for a run you intend
; to submit.
total_timesteps = 50_000_000
gamma = 0.99
learning_rate = 0.003
minibatch_size = 32768
ent_coef = 0.01
