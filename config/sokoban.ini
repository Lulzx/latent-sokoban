[base]
env_name = sokoban

[vec]
total_agents = 4096
backend = Serial

[policy]
hidden_size = 256
num_layers = 2

[env]
# Hidden tier 1: 8x8, one crate, 0.10 wall density, solutions 4-20 moves.
# max_steps mirrors the server's floor of 30.
board_size = 8
n_crates = 1
wall_density = 10
min_len = 4
max_len = 20
max_steps = 30
# Levels are drawn from a pool built once at init: generation is rejection
# sampling with a BFS inside the loop and does not run at rollout speed, so
# generating per reset would throttle the env. Raise for more diversity at
# the cost of startup time.
pool_size = 4096

[train]
# The leaderboard caps a submitted entry at 2 million environment transitions
# (docs/RULES.md, Fixed Environment-Steps Mode). This default is far above
# that on purpose: development runs are unrestricted, and only the declared
# final run has to fit the budget. Set total_timesteps = 2_000_000 for a run
# you intend to submit.
total_timesteps = 50_000_000
gamma = 0.99
learning_rate = 0.003
minibatch_size = 32768
ent_coef = 0.01
