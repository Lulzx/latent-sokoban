[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-sokoban"
version = "0.1.0"
description = "Shared environment, dataset generator and evaluation harness for the Latent Sokoban Challenge"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# httpx is what starlette's TestClient drives the API tests through, so it
# belongs with the server rather than with the pure-numpy core.
dev = ["pytest>=7", "fastapi>=0.110", "httpx>=0.27"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
baseline = ["torch>=2.1"]
# mkdocs is pinned below 2.0: that release drops the plugin system entirely,
# which would take mkdocstrings and the Material theme with it.
docs = [
  "mkdocs>=1.6,<2.0",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
]

[tool.setuptools]
packages = ["latent_sokoban"]
