[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-sokoban"
version = "0.1.0"
description = "Shared environment, dataset generator and evaluation harness for the Latent Sokoban Challenge"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
baseline = ["torch>=2.1"]

[tool.setuptools]
packages = ["latent_sokoban"]
